<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Витрина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7b2ff7;--accent-dark:#5f1fd6;--accent-light:#f0e9fe;--on-accent:#fff;
  --ink:#241a33;--soft:#6b5f7a;--rule:#e6def2;--paper:#f8f6fc;
  --font-title:'Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;--weight-title:800;
  --ok:#0B6B57;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 var(--font-body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

header{background:var(--accent);color:var(--on-accent);position:sticky;top:0;z-index:40}
header .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--on-accent);color:var(--accent);flex:none;
  display:flex;align-items:center;justify-content:center;font:700 19px var(--font-title);overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain}
.brand b{font:var(--weight-title) 17px/1.15 var(--font-title);display:block}
.brand span{font-size:12px;opacity:.85}
.cart-btn{margin-left:auto;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);color:var(--on-accent);
  border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
.cart-btn b{background:var(--on-accent);color:var(--accent);border-radius:10px;padding:0 7px;font-size:12.5px}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 0 4px}
.chip{border:1px solid var(--rule);background:#fff;border-radius:18px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
select{margin-left:auto;border:1px solid var(--rule);border-radius:9px;padding:8px 11px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;padding:14px 0 30px}
.card{background:#fff;border:1px solid var(--rule);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.card:hover{box-shadow:0 8px 22px rgba(36,26,51,.08)}
.card .pic{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:54px;background:var(--accent-light);position:relative}
.card .badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:9px;padding:2px 8px}
.card .body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.price{display:flex;align-items:baseline;gap:7px}
.price b{font-size:18px;font-weight:800}
.price s{color:var(--soft);font-size:13px}
.nm{font-size:13.5px;line-height:1.35;min-height:36px}
.meta{font-size:11.5px;color:var(--soft)}
.add{margin-top:auto;background:var(--accent);color:var(--on-accent);border:none;border-radius:9px;padding:9px;font-size:13.5px;font-weight:600;cursor:pointer}
.add:hover{background:var(--accent-dark)}
.add[disabled]{background:var(--rule);color:var(--soft);cursor:not-allowed}

.drawer{position:fixed;top:0;right:0;height:100%;width:390px;max-width:94vw;background:#fff;border-left:1px solid var(--rule);
  transform:translateX(102%);transition:transform .22s;z-index:60;display:flex;flex-direction:column}
.drawer.open{transform:none}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
.dhead{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--rule)}
.dhead h3{margin:0;font:800 17px var(--font-title);flex:1}
.x{border:none;background:none;font-size:20px;color:var(--soft);cursor:pointer;line-height:1}
.dbody{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.line{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:10px;padding:9px 11px;font-size:13.5px}
.line .t{flex:1;line-height:1.3}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:25px;height:25px;border:1px solid var(--rule);background:#fff;border-radius:6px;cursor:pointer;font-size:14px;line-height:1}
.sum{font-weight:700;min-width:64px;text-align:right;white-space:nowrap}
.dfoot{border-top:1px solid var(--rule);padding:14px 18px 20px;background:#fdfcff}
.row{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--soft)}
.row.tot{font-size:17px;font-weight:800;color:var(--ink);padding-top:8px}
.row.disc{color:var(--ok);font-weight:600}
.hint{font-size:12.5px;background:var(--accent-light);color:var(--accent-dark);border-radius:9px;padding:8px 11px;margin:8px 0}
.btn{width:100%;background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--rule);font-weight:600;margin-top:7px}
input{width:100%;border:1px solid var(--rule);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;margin-bottom:8px}
.empty{color:var(--soft);text-align:center;padding:44px 10px}
.empty .big{font-size:36px;margin-bottom:10px}

.modal{position:fixed;inset:0;background:rgba(36,26,51,.45);display:none;align-items:center;justify-content:center;z-index:70;padding:18px}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto}
.sheet .top{display:flex;gap:14px;padding:20px 22px 0}
.sheet .pic{width:150px;height:150px;border-radius:12px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:64px;flex:none}
.sheet h2{margin:0 0 6px;font:800 20px var(--font-title)}
.sheet .info{padding:16px 22px 22px}
.sheet ul{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--soft)}

.preview{background:#fbf4e3;border:1px solid #eddcae;border-radius:10px;padding:9px 13px;font-size:13px;margin:14px 0}
footer{border-top:1px solid var(--rule);margin-top:20px;padding:18px 16px 40px;text-align:center;font-size:12.5px;color:var(--soft);background:#fff}
footer a{color:var(--accent-dark)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:22px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="mark" id="mark">·</span>
    <span class="brand"><b id="brandName">Витрина</b><span id="brandTagline"></span></span>
    <button class="cart-btn" id="openCart">🛒 Корзина <b id="cartCount">0</b></button>
  </div>
</header>

<main class="wrap">
  <div id="previewBox"></div>
  <div class="bar" id="cats"></div>
  <div class="bar" style="padding-top:0">
    <span class="meta" id="counter"></span>
    <select id="sort">
      <option value="pop">Популярное</option>
      <option value="cheap">Сначала дешевле</option>
      <option value="exp">Сначала дороже</option>
      <option value="rate">По рейтингу</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer id="footer"></footer>

<aside class="drawer" id="cart" aria-label="Корзина">
  <div class="dhead"><h3>Корзина</h3><button class="x" id="closeCart" aria-label="Закрыть">✕</button></div>
  <div class="dbody" id="cartBody"></div>
  <div class="dfoot" id="cartFoot"></div>
</aside>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = "__API_URL__".startsWith("__API") ? "" : "__API_URL__";
const previewSlug = new URLSearchParams(location.search).get('preview');
const pq = previewSlug ? '?preview=' + encodeURIComponent(previewSlug) : '';
const $ = id => document.getElementById(id);
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' \u20BD';

let items = [], cats = [], cart = {}, cat = 'all', sort = 'pop', cfg = null;

function applyTheme(c) {
  cfg = c;
  const t = c.theme, p = t.palette, f = t.typography, s = document.documentElement.style;
  s.setProperty('--accent', p.accent); s.setProperty('--accent-dark', p.accentDark);
  s.setProperty('--accent-light', p.accentLight); s.setProperty('--on-accent', p.onAccent);
  s.setProperty('--ink', p.ink); s.setProperty('--soft', p.soft);
  s.setProperty('--rule', p.rule); s.setProperty('--paper', p.paper);
  s.setProperty('--font-title', f.title); s.setProperty('--font-body', f.body);
  s.setProperty('--weight-title', f.weightTitle);
  document.title = t.name;
  $('brandName').textContent = t.name;
  $('brandTagline').textContent = t.tagline || '';
  $('mark').innerHTML = t.logo.kind === 'image' ? '<img src="' + t.logo.src + '" alt="">' : t.logo.letter;
  $('footer').innerHTML = t.poweredBy
    ? '<a href="' + t.poweredBy.url + '" target="_blank" rel="noopener">' + t.poweredBy.text + '</a>'
    : '\u00A9 ' + t.name;
  if (c.preview) $('previewBox').innerHTML =
    '<div class="preview">Предпросмотр конфигурации <b>' + c.preview.slug + '</b> — данные не сохраняются.</div>';
}

function visible() {
  const list = items.filter(p => cat === 'all' || p.category === cat);
  const by = { pop: (a, b) => b.reviews - a.reviews, cheap: (a, b) => a.price - b.price,
               exp: (a, b) => b.price - a.price, rate: (a, b) => b.rating - a.rating };
  return list.sort(by[sort]);
}
function renderCats() {
  $('cats').innerHTML = '<button class="chip" data-cat="all" aria-pressed="' + (cat === 'all') + '">Все</button>' +
    cats.map(c => '<button class="chip" data-cat="' + c.code + '" aria-pressed="' + (cat === c.code) + '">' + c.title + '</button>').join('');
}
function renderGrid() {
  const list = visible();
  $('counter').textContent = list.length + ' позиций';
  $('grid').innerHTML = list.map(p => {
    const out = p.available <= 0;
    const disc = p.oldPrice > p.price ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
    return '<article class="card" data-open="' + p.id + '">' +
      '<div class="pic">' + (disc ? '<span class="badge">\u2212' + disc + '%</span>' : '') + (p.emoji || '\uD83D\uDCE6') + '</div>' +
      '<div class="body">' +
        '<div class="price"><b>' + rub(p.price) + '</b>' + (p.oldPrice > p.price ? '<s>' + rub(p.oldPrice) + '</s>' : '') + '</div>' +
        '<div class="nm">' + p.title + '</div>' +
        '<div class="meta">' + (p.reviews ? '\u2605 ' + p.rating.toFixed(1) + ' \u00B7 ' + p.reviews + ' отзывов' : 'Новинка') +
          (out ? ' \u00B7 нет в наличии' : ' \u00B7 в наличии ' + p.available) + '</div>' +
        '<button class="add" data-add="' + p.id + '"' + (out ? ' disabled' : '') + '>' +
          (out ? 'Нет в наличии' : (cart[p.id] ? 'В корзине \u00B7 ' + cart[p.id] : 'В корзину')) + '</button>' +
      '</div></article>';
  }).join('');
}
function openCard(id) {
  const p = items.find(x => x.id === id); if (!p) return;
  $('sheet').innerHTML =
    '<div class="top"><div class="pic">' + (p.emoji || '\uD83D\uDCE6') + '</div><div>' +
      '<h2>' + p.title + '</h2>' +
      '<div class="price"><b>' + rub(p.price) + '</b>' + (p.oldPrice > p.price ? '<s>' + rub(p.oldPrice) + '</s>' : '') + '</div>' +
      '<div class="meta">' + (p.weight ? p.weight + ' \u00B7 ' : '') + p.categoryTitle +
        (p.reviews ? ' \u00B7 \u2605 ' + p.rating.toFixed(1) : '') + '</div>' +
    '</div></div>' +
    '<div class="info"><p>' + p.description + '</p>' +
      (p.features.length ? '<ul>' + p.features.map(f => '<li>' + f + '</li>').join('') + '</ul>' : '') +
      '<div style="margin-top:16px;display:flex;gap:10px">' +
        '<button class="btn" data-add="' + p.id + '"' + (p.available <= 0 ? ' disabled' : '') + '>' +
          (p.available <= 0 ? 'Нет в наличии' : 'В корзину') + '</button>' +
        '<button class="btn ghost" data-close="1" style="margin-top:0">Закрыть</button>' +
      '</div></div>';
  $('modal').classList.add('open');
}

async function renderCart() {
  const ids = Object.keys(cart).filter(id => cart[id] > 0);
  $('cartCount').textContent = ids.reduce((s, id) => s + cart[id], 0);
  renderGrid();
  if (!ids.length) {
    $('cartBody').innerHTML = '<div class="empty"><div class="big">\uD83D\uDED2</div>Корзина пуста</div>';
    $('cartFoot').innerHTML = ''; return;
  }
  const res = await fetch(API + '/api/cart/quote', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ items: ids.map(id => ({ id: id, qty: cart[id] })), channel: 'SITE' })
  });
  const qt = await res.json();
  if (qt.error) { toast('Не хватает остатка'); return; }
  $('cartBody').innerHTML = qt.lines.map(l =>
    '<div class="line"><div class="t">' + l.title + '</div>' +
    '<div class="qty"><button data-dec="' + l.id + '">\u2212</button><span>' + l.qty + '</span><button data-inc="' + l.id + '">+</button></div>' +
    '<div class="sum">' + rub(l.sum) + '</div></div>').join('');
  const tiers = (cfg && cfg.discountTiers) || [];
  const next = tiers.filter(t => qt.qty < t.min).sort((a, b) => a.min - b.min)[0];
  $('cartFoot').innerHTML =
    '<div class="row"><span>' + qt.qty + ' шт.</span><span>' + rub(qt.goods) + '</span></div>' +
    (qt.discount ? '<div class="row disc"><span>Скидка за количество \u2212' + qt.discountPct + '%</span><span>\u2212' + rub(qt.discount) + '</span></div>' : '') +
    '<div class="row tot"><span>Итого</span><span>' + rub(qt.total) + '</span></div>' +
    (next ? '<div class="hint">Ещё ' + (next.min - qt.qty) + ' шт. — скидка ' + next.pct + '%</div>' : '') +
    '<button class="btn" id="toCheckout">Оформить заказ</button>' +
    '<button class="btn ghost" id="clearCart">Очистить</button>';
}
function checkoutForm() {
  $('cartBody').innerHTML =
    '<input id="cName" placeholder="Имя" autocomplete="name">' +
    '<input id="cPhone" placeholder="Телефон" autocomplete="tel">' +
    '<input id="cAddr" placeholder="Адрес доставки" autocomplete="street-address">' +
    '<div class="meta">Оплата подключается на этапе платежей: заказ создаётся, деньги не списываются.</div>';
  $('cartFoot').innerHTML =
    '<button class="btn" id="placeOrder">Подтвердить заказ</button>' +
    '<button class="btn ghost" id="backToCart">Назад в корзину</button>';
}
async function placeOrder() {
  const ids = Object.keys(cart).filter(id => cart[id] > 0);
  const res = await fetch(API + '/api/orders', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      items: ids.map(id => ({ id: id, qty: cart[id] })), channel: 'SITE',
      customer: { name: $('cName').value, phone: $('cPhone').value, address: $('cAddr').value }
    })
  });
  const o = await res.json();
  if (o.error) { toast(o.error === 'CUSTOMER_REQUIRED' ? 'Укажите имя или телефон' : 'Не удалось оформить'); return; }
  cart = {};
  $('cartBody').innerHTML = '<div class="empty"><div class="big">\u2705</div><b style="color:var(--ink)">Заказ ' + o.id + ' создан</b><br>' +
    o.qty + ' шт. на ' + rub(o.total) + '<br><br>Он уже виден в кабинете продавца.</div>';
  $('cartFoot').innerHTML = '<button class="btn ghost" id="backShop">К покупкам</button>';
  $('cartCount').textContent = '0';
  await loadCatalog();
}
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2000); };

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-add],[data-inc],[data-dec],[data-cat],[data-open],[data-close],button');
  if (!el) return;
  if (el.dataset.add) { e.stopPropagation(); cart[el.dataset.add] = (cart[el.dataset.add] || 0) + 1; await renderCart(); toast('Добавлено'); return; }
  if (el.dataset.inc) { cart[el.dataset.inc]++; return renderCart(); }
  if (el.dataset.dec) { const id = el.dataset.dec; cart[id]--; if (cart[id] <= 0) delete cart[id]; return renderCart(); }
  if (el.dataset.cat) { cat = el.dataset.cat; renderCats(); renderGrid(); return; }
  if (el.dataset.close) { $('modal').classList.remove('open'); return; }
  if (el.dataset.open) { openCard(el.dataset.open); return; }
  switch (el.id) {
    case 'openCart': $('cart').classList.add('open'); break;
    case 'closeCart': $('cart').classList.remove('open'); break;
    case 'clearCart': cart = {}; await renderCart(); break;
    case 'toCheckout': checkoutForm(); break;
    case 'backToCart': case 'backShop': await renderCart(); break;
    case 'placeOrder': await placeOrder(); break;
  }
});
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') $('modal').classList.remove('open'); });
$('sort').addEventListener('change', e => { sort = e.target.value; renderGrid(); });

async function loadCatalog() {
  const d = await (await fetch(API + '/api/catalog?channel=SITE')).json();
  items = d.items; cats = d.categories;
  renderCats(); renderGrid();
}
(async () => {
  try {
    applyTheme(await (await fetch(API + '/api/config' + pq)).json());
    await loadCatalog();
    await renderCart();
  } catch (e) {
    $('grid').innerHTML = '<p class="meta">API недоступен: ' + e.message + '</p>';
  }
})();
</script>
</body>
</html>
