<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Витрина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#7b2ff7; --accent-dark:#5f1fd6; --accent-light:#f0e9fe; --on-accent:#fff;
    --ink:#241a33; --soft:#6b5f7a; --rule:#e6def2; --paper:#f8f6fc;
    --font-title:'Inter',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --weight-title:800;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 var(--font-body);background:var(--paper);color:var(--ink)}
  header{background:var(--accent);color:var(--on-accent);padding:12px 18px;display:flex;align-items:center;gap:12px}
  header .mark{width:36px;height:36px;border-radius:10px;background:var(--on-accent);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font:700 18px var(--font-title);overflow:hidden;flex:none}
  header .mark img{width:100%;height:100%;object-fit:contain}
  header b{font:var(--weight-title) 17px/1.2 var(--font-title)}
  header span{display:block;font-size:12px;opacity:.85;font-weight:400}
  main{max-width:900px;margin:0 auto;padding:22px 18px}
  .card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:18px 20px;margin-bottom:14px}
  h1{font:var(--weight-title) 22px/1.2 var(--font-title);margin:0 0 6px}
  .soft{color:var(--soft);font-size:13.5px}
  .btn{display:inline-block;background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;
    padding:10px 18px;font:600 14px var(--font-body);cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--accent-dark)}
  .chip{display:inline-block;background:var(--accent-light);color:var(--accent-dark);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:600}
  .preview{background:#fbf4e3;border:1px solid #eddcae;border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:14px}
  code{background:var(--accent-light);color:var(--accent-dark);padding:1px 6px;border-radius:5px;font-size:12.5px}
  footer{border-top:1px solid var(--rule);margin-top:20px;padding:16px 18px;text-align:center;font-size:12.5px;color:var(--soft)}
  footer a{color:var(--accent-dark)}
</style>
</head>
<body>
<header>
  <span class="mark" id="mark">·</span>
  <span><b id="brandName">Витрина</b><span id="brandTagline"></span></span>
</header>
<main>
  <div id="previewBox"></div>
  <div class="card">
    <h1 id="title">Каркас витрины</h1>
    <p class="soft" id="lead">Оформление, тексты и каталог приходят из конфигурации — в этом файле их нет.</p>
    <p><span class="chip" id="themeInfo">тема</span></p>
    <a class="btn" href="#">Кнопка в акцентном цвете</a>
  </div>
  <div class="card">
    <b>Связь с API</b>
    <p class="soft">Адрес подставляется при сборке: <code id="api">__API_URL__</code></p>
    <pre class="soft" id="health" style="white-space:pre-wrap;margin:0"></pre>
  </div>
</main>
<footer id="footer"></footer>
<script>
const API = "__API_URL__".startsWith("__API") ? "" : "__API_URL__";
document.getElementById('api').textContent = API || 'не задан (локальный режим)';
const preview = new URLSearchParams(location.search).get('preview');
const q = preview ? '?preview=' + encodeURIComponent(preview) : '';

fetch(API + '/api/config' + q).then(r => r.json()).then(cfg => {
  const t = cfg.theme, p = t.palette, f = t.typography, s = document.documentElement.style;
  s.setProperty('--accent', p.accent);       s.setProperty('--accent-dark', p.accentDark);
  s.setProperty('--accent-light', p.accentLight); s.setProperty('--on-accent', p.onAccent);
  s.setProperty('--ink', p.ink);             s.setProperty('--soft', p.soft);
  s.setProperty('--rule', p.rule);           s.setProperty('--paper', p.paper);
  s.setProperty('--font-title', f.title);    s.setProperty('--font-body', f.body);
  s.setProperty('--weight-title', f.weightTitle);

  document.getElementById('brandName').textContent = t.name;
  document.getElementById('brandTagline').textContent = t.tagline || '';
  document.getElementById('title').textContent = cfg.texts.heroTitle || t.tagline || t.name;
  if (cfg.texts.heroLead) document.getElementById('lead').textContent = cfg.texts.heroLead;
  document.getElementById('themeInfo').textContent =
    'акцент ' + p.accent + ' · контраст ' + p.contrastOnAccent + ' · типографика из конфигурации';

  const mark = document.getElementById('mark');
  mark.innerHTML = t.logo.kind === 'image'
    ? '<img src="' + t.logo.src + '" alt="">'
    : t.logo.letter;

  document.getElementById('footer').innerHTML = t.poweredBy
    ? '<a href="' + t.poweredBy.url + '" target="_blank" rel="noopener">' + t.poweredBy.text + '</a>'
    : '© ' + t.name;

  if (cfg.preview) document.getElementById('previewBox').innerHTML =
    '<div class="preview">Предпросмотр конфигурации <b>' + cfg.preview.slug + '</b> — данные не сохраняются.</div>';
}).catch(() => {});

fetch(API + '/api/health').then(r => r.json())
  .then(h => document.getElementById('health').textContent = JSON.stringify(h, null, 2))
  .catch(e => document.getElementById('health').textContent = 'API недоступен: ' + e.message);
</script>
</body>
</html>
