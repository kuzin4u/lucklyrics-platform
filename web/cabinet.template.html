<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинет продавца</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7b2ff7;--accent-dark:#5f1fd6;--accent-light:#f0e9fe;--on-accent:#fff;
  --ink:#241a33;--soft:#6b5f7a;--rule:#e6def2;--paper:#f8f6fc;
  --font-title:'Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;--weight-title:800;
  --ok:#0B6B57;--ok-l:#e6f5f0;--warn:#8a6810;--warn-l:#fbf4e3;--bad:#a4243b;--bad-l:#fbeaed;
}
*{box-sizing:border-box}
body{margin:0;font:14.5px/1.5 var(--font-body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{background:#fff;border-bottom:1px solid var(--rule);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);flex:none;
  display:flex;align-items:center;justify-content:center;font:700 17px var(--font-title);overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain}
header b{font:var(--weight-title) 16px var(--font-title);display:block}
header small{color:var(--soft);font-size:12px}
header .right{margin-left:auto;display:flex;gap:8px}
.ghost{border:1px solid var(--rule);background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}
.ghost:hover{border-color:var(--accent);color:var(--accent-dark)}

main{padding:20px;max-width:1180px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--rule);border-radius:13px;padding:13px 15px}
.kpi .l{font-size:11.5px;color:var(--soft)}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.panel{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:15.5px;font-weight:800;margin:0 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:#fff;border-radius:18px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .c{opacity:.7;font-size:11.5px}
.pipe{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pipe button{flex:1;min-width:120px;border:1px solid var(--rule);background:#fdfcff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer}
.pipe button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-light)}
.pipe .n{font-size:19px;font-weight:800}
.pipe .s{font-size:12px;color:var(--soft)}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;color:var(--soft);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:hover td{background:#fdfcff}
.oid{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:600}
.soft{color:var(--soft);font-size:12.5px}
.tag{font-size:11px;font-weight:700;border-radius:10px;padding:2px 9px;white-space:nowrap;display:inline-block;background:var(--accent-light);color:var(--accent-dark)}
.st{font-size:11.5px;font-weight:700;border-radius:10px;padding:3px 10px;white-space:nowrap}
.s-NEW{background:var(--warn-l);color:var(--warn)}
.s-PACKING{background:#eef0ff;color:#3f42a8}
.s-SHIPPED{background:#e5f3ff;color:#0a63b8}
.s-DONE{background:var(--ok-l);color:var(--ok)}
.s-CANCELLED{background:var(--bad-l);color:var(--bad)}
.rowbtn{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.rowbtn:hover{border-color:var(--accent);color:var(--accent-dark)}
.rowbtn.cancel{color:var(--bad)}
.empty{padding:34px;text-align:center;color:var(--soft)}
</style>
</head>
<body>

<header>
  <span class="mark" id="mark">·</span>
  <span><b id="brandName">Кабинет</b><small id="brandTagline">управление заказами</small></span>
  <span class="right">
    <a class="ghost" href="index.html">Открыть витрину</a>
    <button class="ghost" id="reload">Обновить</button>
  </span>
</header>

<main>
  <div class="kpis">
    <div class="kpi"><div class="l">Заказов</div><div class="v" id="kOrders">—</div></div>
    <div class="kpi"><div class="l">Выручка</div><div class="v" id="kRevenue">—</div></div>
    <div class="kpi"><div class="l">Средний чек</div><div class="v" id="kAvg">—</div></div>
    <div class="kpi"><div class="l">Позиций продано</div><div class="v" id="kItems">—</div></div>
  </div>

  <section class="panel">
    <h2>Каналы продаж</h2>
    <div class="chips" id="chans"></div>
    <div class="pipe" id="pipe"></div>
  </section>

  <section class="panel">
    <div class="scroll">
      <table>
        <thead><tr><th>Заказ</th><th>Клиент</th><th>Состав</th><th>Канал</th><th>Сумма</th><th>Статус</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="soft" id="foot" style="margin-top:12px"></div>
  </section>
</main>

<script>
const API = "__API_URL__".startsWith("__API") ? "" : "__API_URL__";
const $ = id => document.getElementById(id);
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' \u20BD';
const FLOW = { NEW: ['PACKING', 'В сборку'], PACKING: ['SHIPPED', 'Отгрузить'], SHIPPED: ['DONE', 'Доставлен'] };

let orders = [], stats = {}, fCh = 'all', fSt = 'all';

function applyTheme(c) {
  const t = c.theme, p = t.palette, f = t.typography, s = document.documentElement.style;
  s.setProperty('--accent', p.accent); s.setProperty('--accent-dark', p.accentDark);
  s.setProperty('--accent-light', p.accentLight); s.setProperty('--on-accent', p.onAccent);
  s.setProperty('--ink', p.ink); s.setProperty('--soft', p.soft);
  s.setProperty('--rule', p.rule); s.setProperty('--paper', p.paper);
  s.setProperty('--font-title', f.title); s.setProperty('--font-body', f.body);
  s.setProperty('--weight-title', f.weightTitle);
  document.title = t.name + ' — кабинет';
  $('brandName').textContent = t.name;
  $('mark').innerHTML = t.logo.kind === 'image' ? '<img src="' + t.logo.src + '" alt="">' : t.logo.letter;
}

const match = o => (fCh === 'all' || o.channel === fCh) && (fSt === 'all' || o.status === fSt);

function render() {
  $('kOrders').textContent = stats.orders || 0;
  $('kRevenue').textContent = rub(stats.revenue || 0);
  $('kAvg').textContent = rub(stats.avgCheck || 0);
  $('kItems').textContent = stats.items || 0;

  const chans = {};
  orders.forEach(o => chans[o.channel] = { title: o.channelTitle || o.channel, n: (chans[o.channel] ? chans[o.channel].n : 0) + 1 });
  $('chans').innerHTML = '<button class="chip" data-ch="all" aria-pressed="' + (fCh === 'all') + '">Все каналы <span class="c">' + orders.length + '</span></button>' +
    Object.keys(chans).map(code =>
      '<button class="chip" data-ch="' + code + '" aria-pressed="' + (fCh === code) + '">' + chans[code].title + ' <span class="c">' + chans[code].n + '</span></button>').join('');

  const base = orders.filter(o => fCh === 'all' || o.channel === fCh);
  const titles = { NEW: 'Новые', PACKING: 'Собираются', SHIPPED: 'В доставке', DONE: 'Доставлены', CANCELLED: 'Отменены' };
  $('pipe').innerHTML = '<button data-st="all" aria-pressed="' + (fSt === 'all') + '"><div class="n">' + base.length + '</div><div class="s">Все заказы</div></button>' +
    Object.keys(titles).map(st =>
      '<button data-st="' + st + '" aria-pressed="' + (fSt === st) + '"><div class="n">' + base.filter(o => o.status === st).length + '</div><div class="s">' + titles[st] + '</div></button>').join('');

  const list = orders.filter(match);
  $('rows').innerHTML = list.length ? list.map(o => {
    const nx = FLOW[o.status];
    return '<tr>' +
      '<td><div class="oid">' + o.id + '</div><div class="soft">' + new Date(o.at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</div></td>' +
      '<td>' + (o.customer.name || '—') + '<div class="soft">' + (o.customer.phone || '') + '</div></td>' +
      '<td class="soft" style="max-width:280px">' + o.items.map(i => i.title + ' \u00D7' + i.qty).join('; ') +
        (o.discount ? '<div>скидка \u2212' + o.discountPct + '%</div>' : '') + '</td>' +
      '<td><span class="tag">' + (o.channelTitle || o.channel) + '</span></td>' +
      '<td><b>' + rub(o.total) + '</b></td>' +
      '<td><span class="st s-' + o.status + '">' + o.statusTitle + '</span></td>' +
      '<td>' + (nx ? '<button class="rowbtn" data-adv="' + o.id + '" data-to="' + nx[0] + '">' + nx[1] + '</button> ' : '') +
        (o.status !== 'DONE' && o.status !== 'CANCELLED' ? '<button class="rowbtn cancel" data-adv="' + o.id + '" data-to="CANCELLED">Отменить</button>' : '') + '</td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="7" class="empty">Заказов по этим фильтрам нет. Оформите заказ на витрине — он появится здесь.</td></tr>';
  $('foot').textContent = 'Показано ' + list.length + ' из ' + orders.length;
}

async function load() {
  const d = await (await fetch(API + '/api/orders')).json();
  orders = d.orders; stats = d.stats; render();
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ch) { fCh = b.dataset.ch; return render(); }
  if (b.dataset.st) { fSt = b.dataset.st; return render(); }
  if (b.dataset.adv) {
    await fetch(API + '/api/orders/status', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: b.dataset.adv, status: b.dataset.to })
    });
    return load();
  }
  if (b.id === 'reload') return load();
});

(async () => {
  try {
    applyTheme(await (await fetch(API + '/api/config')).json());
    await load();
  } catch (e) {
    $('rows').innerHTML = '<tr><td colspan="7" class="empty">API недоступен: ' + e.message + '</td></tr>';
  }
})();
</script>
</body>
</html>
